<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sopa da Roxa — Delivery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-delivery.css">
</head>
<body>

<header>
  <h1>🚴 Delivery</h1>
  <nav>
    <a href="/">Mesas</a>
    <a href="/delivery" class="active">Delivery</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/historico">Histórico</a>
  </nav>
</header>

<div class="delivery-container">

  <!-- NOVO PEDIDO -->
  <div id="novo-pedido-section" class="section">
    <h2>📋 Novo Pedido Delivery</h2>

    <div class="form-group">
      <label class="label">Nome do Cliente</label>
      <input id="cliente-nome" type="text" class="input-field" placeholder="Ex: João Silva">
    </div>

    <div class="form-group">
      <label class="label">Telefone</label>
      <input id="cliente-telefone" type="tel" class="input-field" placeholder="(81) 99999-9999">
    </div>

    <div class="form-group">
      <label class="label">Endereço de Entrega</label>
      <input id="cliente-endereco" type="text" class="input-field" placeholder="Rua..., Número...">
    </div>

    <div class="form-group">
      <label class="label">Tipo de Entrega</label>
      <div class="radio-group">
        <label><input type="radio" name="tipo-entrega" value="normal" checked> 🚴 Delivery Normal (R$ 5,00)</label>
        <label><input type="radio" name="tipo-entrega" value="uber_flash"> 🚗 Uber Flash</label>
        <label><input type="radio" name="tipo-entrega" value="99flash"> 🚗 99 Flash</label>
      </div>
    </div>

    <!-- CARDÁPIO -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-sopas-delivery">🥣 Sopas</button>
      <button class="tab-btn" data-tab="tab-tapiocas-delivery">🌮 Tapiocas</button>
      <button class="tab-btn" data-tab="tab-bebidas-delivery">🥤 Bebidas</button>
    </div>

    <div id="tab-sopas-delivery" class="tab-content active">
      <div id="lista-sopas-delivery" class="produtos-grid"></div>
    </div>

    <div id="tab-tapiocas-delivery" class="tab-content">
      <div id="lista-tapiocas-delivery" class="produtos-grid"></div>
    </div>

    <div id="tab-bebidas-delivery" class="tab-content">
      <div class="bebida-form card">
        <h3>Adicionar Bebida</h3>
        <input id="bebida-nome-delivery" type="text" placeholder="Nome" class="input-field">
        <input id="bebida-preco-delivery" type="number" step="0.01" placeholder="Preço" class="input-field">
        <button class="btn btn-primary" onclick="adicionarBebidaDelivery()">➕ Adicionar</button>
      </div>
    </div>

    <!-- PEDIDO LATERAL -->
    <div class="pedido-lateral">
      <h3>📦 Itens</h3>
      <div id="itens-delivery" class="itens-lista"></div>
      <div id="obs-delivery-box" class="obs-box">
        <textarea id="obs-delivery" placeholder="Observações..." rows="2"></textarea>
      </div>
      <div class="total-section">
        <div>Subtotal: R$ <span id="subtotal-delivery">0.00</span></div>
        <div>Taxa: R$ <span id="taxa-delivery">5.00</span></div>
        <div class="total-grande">Total: R$ <span id="total-delivery">5.00</span></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="confirmarDelivery()">✅ Confirmar Pedido</button>
    </div>
  </div>

  <!-- PEDIDOS ATIVOS -->
  <div id="pedidos-section" class="section">
    <h2>📦 Pedidos em Andamento</h2>
    <div id="lista-pedidos-delivery" class="pedidos-lista"></div>
  </div>

</div>

<!-- MODAL CUPOM -->
<div id="modal-cupom-delivery" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h2>🧾 Cupom</h2>
    <pre id="cupom-delivery-texto" class="cupom-pre"></pre>
    <div class="modal-btns">
      <button class="btn btn-secundario" onclick="fecharModalDelivery()">Fechar</button>
      <button class="btn btn-primary" onclick="imprimirDelivery()">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script src="delivery.js"></script>
</body>
</html>
